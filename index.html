<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Projetos de promoção e patrocínio | BB Asset</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4FA;--surface:#FFFFFF;--surface-2:#EAEEF9;--ink:#141A3C;--ink-2:#454C73;--muted:#6B7296;--line:#D9DEEE;
  --azul:#465EFF;--azul-ink:#2F43D9;--azul-soft:#E3E7FF;--amarelo:#FCFC30;--navy:#141A3C;--navy-2:#232B5E;
  --ok:#13805F;--ok-soft:#DDF3EC;--warn:#8A6100;--warn-soft:#FFF1BF;--bad:#B8322A;--bad-soft:#FBE3E1;
  --n-promo:#E3BD00;--n-direto:#465EFF;--n-cultura:#98A4FF;--n-esporte:#1597B5;--n-mob:#141A3C;
  --r:14px;--shadow:0 1px 2px rgba(20,26,60,.05),0 12px 28px -18px rgba(20,26,60,.3);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0D1130;--surface:#151A3E;--surface-2:#1D2352;--ink:#EDEFFA;--ink-2:#BCC1DE;--muted:#8D93B8;--line:#2A3166;
    --azul:#6F82FF;--azul-ink:#A3AFFF;--azul-soft:#232B66;--navy:#080B22;--navy-2:#1A2050;
    --ok:#4CC9A0;--ok-soft:#123A33;--warn:#F2C64B;--warn-soft:#3A3114;--bad:#FF8A80;--bad-soft:#3F1B1E;
    --n-direto:#6F82FF;--n-mob:#CBD1F2;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 28px -18px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Manrope","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
.lbl{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:4px}
h1,h2,h3{letter-spacing:-.015em}

/* Estrutura */
.app{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}
.side{background:var(--navy);color:#E7EAFF;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:22px 14px;overflow:auto}
.brand{display:block;padding:2px 10px 24px}
.brand-mark{width:36px;height:36px;border-radius:10px;background:var(--amarelo);display:grid;place-items:center;color:#141A3C;font-weight:800;font-size:13px;letter-spacing:-.03em;flex:none}
.brand b{display:block;font-size:15px;line-height:1.2;color:#fff}
.brand small{color:#9EA6D6;font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:10px;color:#C4CAF0;font-weight:600;font-size:14px;position:relative}
.nav button:hover{background:var(--navy-2);color:#fff}
.nav button[aria-current="page"]{background:var(--navy-2);color:#fff}
.nav button[aria-current="page"]::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:4px;border-radius:0 4px 4px 0;background:var(--amarelo)}
.nav button:focus-visible{outline:2px solid var(--amarelo);outline-offset:2px}
.nav .count{font-size:11.5px;font-weight:800;background:var(--amarelo);color:#141A3C;border-radius:20px;padding:0 7px;min-width:20px;text-align:center}
.nav-sep{height:1px;background:rgba(255,255,255,.09);margin:12px 8px}
.side-foot{margin-top:auto;font-size:12px;color:#8E96C8;padding:14px 10px 4px;line-height:1.5}
.side-foot .link{color:var(--amarelo)}
main{min-width:0}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 30px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.top h1{font-size:22px;margin:0;font-weight:800;line-height:1.2}
.top .sub{color:var(--muted);font-size:13px;margin-top:2px}
.top-right{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 3px}
.who select{width:auto;padding:4px 2px;border:0;background:transparent;font-weight:700;font-size:14px;max-width:170px;cursor:pointer}
.year{width:auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-weight:700;font-size:14px}
.role-tag{font-size:11.5px;font-weight:800;padding:2px 9px;border-radius:999px;background:var(--amarelo);color:#141A3C}
.role-tag.an{background:var(--azul-soft);color:var(--azul-ink)}

/* Régua do orçamento */
.ribbon{padding:20px 30px 8px}
.ribbon-head{display:flex;align-items:flex-end;gap:12px 30px;flex-wrap:wrap;margin-bottom:12px}
.ribbon-big{font-size:34px;font-weight:800;letter-spacing:-.035em;line-height:1}
.ribbon-meta{color:var(--ink-2);font-size:14px}
.ribbon-meta b{color:var(--ink);font-size:17px;font-weight:800;display:block;letter-spacing:-.01em}
.bar{height:24px;border-radius:7px;background:var(--surface-2);display:flex;overflow:hidden;border:1px solid var(--line)}
.bar span{height:100%;display:block;flex:none}
.bar span+span{box-shadow:inset 2px 0 0 var(--surface)}
.bar.thin{height:12px;border-radius:6px}
.bar-legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:9px;font-size:12.5px;color:var(--ink-2)}
.bar-legend b{color:var(--ink)}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:-1px;flex:none}

/* Conteúdo */
.view{padding:16px 30px 80px;max-width:1380px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.mt{margin-top:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow);min-width:0}
.card>h2{font-size:16px;margin:0 0 14px;font-weight:800;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card>h2 small{font-weight:600;font-size:12.5px;color:var(--muted)}
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:16px}
.strip>div{padding:16px 20px;border-left:1px solid var(--line);min-width:0}
.strip>div:first-child{border-left:0}
.strip .v{font-size:26px;font-weight:800;letter-spacing:-.025em;line-height:1.15}
.strip .l{color:var(--muted);font-size:13px;font-weight:600}
.strip .s{font-size:12.5px;color:var(--ink-2);margin-top:3px}
.empty{padding:30px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

/* Botões e campos */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--azul)}
.btn.primary{background:var(--azul);border-color:var(--azul);color:#fff}
.btn.primary:hover{background:var(--azul-ink);border-color:var(--azul-ink)}
.btn.yellow{background:var(--amarelo);border-color:#D6D600;color:#141A3C}
.btn.yellow:hover{border-color:#141A3C}
.btn.danger{color:var(--bad)}
.btn.danger:hover{border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--azul-ink);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-align:left}
.linkish{all:unset;cursor:pointer;font-weight:800;font-size:15px}
.linkish:hover{color:var(--azul-ink);text-decoration:underline}
:is(.btn,.link,.linkish,input,select,textarea,.cal .d):focus-visible{outline:2px solid var(--azul);outline-offset:2px}
.icon-btn{width:34px;height:34px;flex:none;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;color:var(--muted);font-size:18px;line-height:1}
.icon-btn:hover:not([disabled]){color:var(--bad);border-color:var(--bad)}
.icon-btn[disabled]{opacity:.35;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label{font-size:13px;font-weight:700;color:var(--ink-2)}
.hint{font-size:12.5px;color:var(--muted)}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=month],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%;min-width:0;font-size:14.5px}
input:hover,select:hover,textarea:hover{border-color:color-mix(in srgb,var(--azul) 45%,var(--line))}
textarea{min-height:80px;resize:vertical}
input.money{text-align:right;font-weight:700}
.span2{grid-column:1/-1}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.tight{gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:5px 13px 5px 5px;font-size:14px;font-weight:700;cursor:pointer;background:var(--surface);user-select:none}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip.on{background:var(--azul);border-color:var(--azul);color:#fff}
.chip:has(input:focus-visible){outline:2px solid var(--azul);outline-offset:2px}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:800;white-space:nowrap;line-height:1.5}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.neutral{background:var(--surface-2);color:var(--ink-2)}
.pill.pd{background:var(--amarelo);color:#141A3C}
.nat{display:inline-flex;align-items:center;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-right:10px;white-space:nowrap}
.uf{display:inline-block;font-size:11.5px;font-weight:800;border:1px solid var(--line);border-radius:5px;padding:0 5px;color:var(--ink-2);margin-right:3px;background:var(--surface)}
.avs{display:inline-flex}
.avatar{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;font-weight:800;font-size:11.5px;color:#fff;flex:none;background:var(--azul)}
.avatar.sm{width:26px;height:26px;font-size:10.5px;border:2px solid var(--surface)}
.avs .avatar.sm+.avatar.sm{margin-left:-7px}
.avatar.xs{width:22px;height:22px;font-size:9.5px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);flex:none}
.seg button{border:0;background:transparent;padding:7px 12px;font-weight:700;font-size:13px;cursor:pointer;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--ink);color:var(--surface)}
.err{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:12px 14px;font-weight:600;font-size:14px;margin-bottom:14px}
.err ul{margin:4px 0 0;padding-left:18px}
.note{background:var(--azul-soft);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:13.5px}

/* Filtros e tabelas */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.filters select,.filters input{width:auto;padding:7px 10px;font-size:13.5px}
.filters input[type=search]{min-width:240px;flex:1 1 240px}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12.5px;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface-2)}
.tbl .r{text-align:right}
.tbl tfoot td{font-weight:800;border-bottom:0}
.pname{font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.psub{font-size:12.5px;color:var(--muted);margin-top:2px}
.prog{height:7px;border-radius:9px;background:var(--surface-2);overflow:hidden;min-width:80px}
.prog i{display:block;height:100%;background:var(--azul);border-radius:9px}

/* Painel */
.pend-row{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:9px 6px;border-bottom:1px solid var(--line);border-radius:6px}
.pend-row:hover{background:var(--surface-2)}
.pend-row:last-child{border-bottom:0}
.pend-row small{display:block;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pend-row b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pdate{font-weight:800;font-size:13px;text-align:center;border-radius:8px;padding:4px 0;background:var(--surface-2)}
.pdate.late{background:var(--bad-soft);color:var(--bad)}
.pdate.soon{background:var(--warn-soft);color:var(--warn)}
.hbar{display:grid;grid-template-columns:minmax(90px,170px) minmax(0,1fr) auto;gap:12px;align-items:center;font-size:13.5px;margin:9px 0}
.hbar .t{height:12px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.hbar .t i{display:block;height:100%;border-radius:6px}
.hbar .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.hbar .vv{font-weight:800;text-align:right;min-width:90px}
.hbar .vv small{display:block;font-weight:600;color:var(--muted);font-size:11.5px}
.pdm-nums{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.pdm-nums b{font-size:24px;font-weight:800;letter-spacing:-.02em;display:block;line-height:1.1}
.pdm-r{color:var(--muted);font-size:13px}
.pdm-l{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-top:8px}

/* Gaveta e modal */
.overlay{position:fixed;inset:0;background:rgba(8,11,34,.5);z-index:50;display:flex;justify-content:flex-end}
.overlay.center{justify-content:center;align-items:center;padding:16px}
.drawer{background:var(--bg);width:min(740px,100%);height:100%;overflow:auto;padding:20px 28px 70px;animation:slide .2s ease-out;padding-top:calc(20px + env(safe-area-inset-top,0px))}
@keyframes slide{from{transform:translateX(30px);opacity:.3}}
.modal{background:var(--surface);border-radius:16px;width:min(620px,100%);padding:22px 24px;max-height:88vh;overflow:auto;border:1px solid var(--line)}
.modal h2{margin:0 0 6px;font-size:18px}
.dr-top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.dr-title{font-size:26px;font-weight:800;margin:0 0 8px;line-height:1.15;letter-spacing:-.025em}
.dr-desc{color:var(--ink-2);margin:10px 0 0;max-width:68ch}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 18px;margin:18px 0 0;padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.facts dt{font-size:12.5px;color:var(--muted);font-weight:700}
.facts dd{margin:2px 0 0;font-weight:700;font-size:14px}
.dr-sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-top:14px}
.dr-sec>h3{margin:0 0 12px;font-size:15.5px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pl{list-style:none;margin:0;padding:0}
.pl li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.pl li:last-child{border-bottom:0}
.pl li.done b{text-decoration:line-through;color:var(--muted)}
.ck{display:flex;align-items:center;gap:10px;flex:1;min-width:0;cursor:pointer}
.ck input{width:18px;height:18px;accent-color:var(--azul);flex:none}
.ck b{font-weight:700;font-size:14px}
.auto{font-style:normal;font-size:11.5px;color:var(--muted);margin-left:8px;font-weight:700}
.pdate2{font-weight:700;font-size:13px;color:var(--ink-2);white-space:nowrap}
.pdate2.late{color:var(--bad)}
.pend-add{margin-top:10px}
.pend-add input[type=text]{flex:1 1 220px;width:auto}
.pend-add input[type=date]{width:auto}
.hist{list-style:none;margin:0;padding:0;font-size:13px}
.hist li{padding:6px 0;border-bottom:1px dashed var(--line);color:var(--ink-2)}
.hist li:last-child{border-bottom:0}
.hist time{color:var(--muted);margin-right:8px;font-weight:700}

/* Formulário */
.form-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;padding-bottom:6px}
.form-head h2{margin:0;font-size:20px}
.form-head p{margin:4px 0 0;color:var(--muted);max-width:70ch;font-size:14px}
.form-sec{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;padding:24px 0;border-top:1px solid var(--line)}
.sec-t h3{margin:0 0 4px;font-size:15px}
.sec-t p{margin:0;color:var(--muted);font-size:13px;line-height:1.45}
.loc-row{display:flex;gap:8px;margin-bottom:8px;max-width:420px}
.rub-head,.rub{display:grid;grid-template-columns:minmax(150px,1.3fr) minmax(100px,.9fr) 132px minmax(100px,1fr) 124px 116px 34px;gap:8px;align-items:center}
.rub-head{font-size:12px;color:var(--muted);font-weight:700;padding:0 0 6px 12px}
.rub{padding:8px 0 8px 10px;border-left:4px solid var(--c,var(--line));margin-bottom:6px;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 8%,transparent),transparent 40%);border-radius:4px}
.rub.is-pd{background:linear-gradient(90deg,color-mix(in srgb,var(--amarelo) 30%,transparent),transparent 70%)}
.rub.over input.money{border-color:var(--bad);box-shadow:0 0 0 2px var(--bad-soft)}
.rub-alert{grid-column:1/-1;font-size:12.5px;font-weight:700;color:var(--ink-2);padding-left:2px}
.rub-alert:empty{display:none}
.rub-alert.bad{color:var(--bad)}
.pdck{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:800;line-height:1.15;cursor:pointer;padding:6px 8px;border:1px solid var(--line);border-radius:9px;background:var(--surface);user-select:none}
.pdck input{width:17px;height:17px;flex:none;accent-color:#141A3C;margin:0}
.pdck:has(input:checked){background:var(--amarelo);border-color:#C9C900;color:#141A3C}
.pdck:has(input:focus-visible){outline:2px solid var(--azul);outline-offset:2px}
.pdbox-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.pdbox-h b{font-size:15px}
.pdbox .pdm+p{margin-bottom:0}
.pdm-block+.pdm-block{margin-top:16px;padding-top:16px;border-top:1px dashed var(--line)}
.brand-logo{display:block;max-width:100%;max-height:44px;width:auto;height:auto}
.brand-slot{display:flex;align-items:center;justify-content:center;border:1px dashed rgba(255,255,255,.3);border-radius:10px;height:44px;color:#9EA6D6;font-size:12px;font-weight:700;padding:0 10px;text-align:center}
.brand-name b{display:block;font-size:15px;line-height:1.2;color:#fff;margin-top:12px}
.brand-name small{color:#9EA6D6;font-size:12px}
.logo-prev{background:var(--navy);border-radius:12px;padding:16px;display:flex;align-items:center;justify-content:center;min-height:84px;margin-bottom:12px}
.logo-prev img{max-height:56px;max-width:100%}
.rep-logo{max-height:40px;margin-bottom:8px;background:var(--navy);padding:8px 12px;border-radius:8px}
.rubsum{margin-top:14px;padding:16px;border-radius:12px;background:var(--surface-2)}
.rs-tot{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;gap:10px}
.rs-tot b{font-size:22px;font-weight:800;letter-spacing:-.02em}
.rs-cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:12px}
.rs-li{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:3px 0}
.rs-note{margin-top:12px;font-size:13px;color:var(--ink-2)}
.autohint{margin-top:12px;font-size:13.5px;background:var(--surface-2);border-radius:10px;padding:12px 14px}
.autohint ul{margin:4px 0 0;padding-left:18px}
.autohint li{margin:3px 0}
.check-big{display:flex;gap:12px;align-items:flex-start;cursor:pointer;padding:14px 16px;border:1px solid var(--line);border-radius:12px;max-width:560px}
.check-big:has(input:checked){border-color:#C9C900;background:color-mix(in srgb,var(--amarelo) 22%,var(--surface))}
.check-big input{width:20px;height:20px;margin-top:2px;accent-color:#141A3C;flex:none}
.check-big b{display:block}
.check-big small{color:var(--muted);font-size:13px}
.pdbox{margin-top:14px;max-width:620px;padding:16px;border-radius:12px;border:1px dashed var(--line)}
.pdbox p{margin:10px 0 0;font-size:13.5px}
.form-actions{position:sticky;bottom:0;z-index:5;display:flex;gap:10px;align-items:center;justify-content:flex-end;flex-wrap:wrap;padding:14px 20px;margin:10px -20px -18px;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);border-radius:0 0 var(--r) var(--r)}
.form-actions .muted{margin-right:auto}

/* Acompanhamento */
.track{display:grid;grid-template-columns:minmax(220px,1.4fr) minmax(190px,1fr) 160px minmax(210px,1.1fr);gap:20px;align-items:start;padding:16px 4px;border-bottom:1px solid var(--line)}
.track:last-child{border-bottom:0}
.track-exp{grid-column:1/-1;background:var(--surface-2);border-radius:12px;padding:12px 16px}
.slider{display:flex;align-items:center;gap:10px}
.slider input{flex:1;accent-color:var(--azul);min-width:0}
.pct{font-weight:800;font-size:18px;min-width:52px;text-align:right}
.nextp b{font-size:14px}

/* Indicadores */
.ind-layout{display:grid;grid-template-columns:minmax(260px,360px) minmax(0,1fr);gap:16px;align-items:start}
.ilist{margin-top:12px;display:flex;flex-direction:column;gap:4px;max-height:640px;overflow:auto}
.ilist button{all:unset;box-sizing:border-box;cursor:pointer;padding:10px 12px;border-radius:10px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.ilist button:hover{background:var(--surface-2)}
.ilist button.on{background:var(--azul-soft)}
.ilist b{font-size:14px;display:block}
.ilist small{color:var(--muted);font-size:12.5px}
.metrics{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:6px}
.metric{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.metric .v{font-size:21px;font-weight:800;letter-spacing:-.02em}
.metric .l{font-size:12.5px;color:var(--muted);font-weight:700}
.metric .c{font-size:12px;margin-top:4px;font-weight:700}
.subh{font-size:14px;margin:20px 0 10px}

/* Calendário */
.cal-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.cal-head h2{margin:0 auto 0 4px;font-size:20px;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--line);gap:1px}
.cal .dh{background:var(--surface-2);font-size:12px;font-weight:800;color:var(--muted);padding:7px 8px}
.cal .d{background:var(--surface);min-height:108px;padding:6px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0}
.cal .d:hover{background:color-mix(in srgb,var(--azul-soft) 50%,var(--surface))}
.cal .d.out{background:var(--bg)}
.cal .d.out .n{opacity:.45}
.cal .d.sel{box-shadow:inset 0 0 0 2px var(--azul)}
.cal .n{font-size:12px;font-weight:800;align-self:flex-start;padding:0 5px;border-radius:6px}
.cal .d.today .n{background:var(--amarelo);color:#141A3C}
.ev{font-size:11.5px;font-weight:700;border-radius:5px;padding:2px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.pend{background:transparent;color:var(--ink-2);border:1px dashed var(--muted)}
.ev.pend.late{border-color:var(--bad);color:var(--bad)}
.more{font-size:11px;color:var(--muted);font-weight:700}

/* Gráficos */
.chart{width:100%;height:auto;display:block}
.chart .ax{font-size:11px;fill:var(--muted);font-weight:600}
.chart .vl{font-size:11px;fill:var(--ink-2);font-weight:800}
.donut-wrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.dn-v{font-size:17px;font-weight:800;fill:var(--ink)}
.dn-l{font-size:10.5px;fill:var(--muted);font-weight:700}
.legend-list{flex:1;min-width:220px}
.rep-head{display:none}

.auth{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;background:var(--navy)}
.auth-logo{max-height:46px;max-width:260px}
.auth-card{background:var(--surface);color:var(--ink);border-radius:18px;padding:28px;width:min(420px,100%);box-shadow:0 30px 60px -30px rgba(0,0,0,.6)}
.auth-card h1{font-size:22px;margin:0 0 6px}
.auth-card>p{color:var(--ink-2);margin:0 0 18px;font-size:14px}
.auth-card .field{margin-bottom:12px}
.auth-card .btn{width:100%;margin-top:6px;padding:11px 14px}
.auth-links{display:flex;justify-content:space-between;gap:10px;margin-top:16px;font-size:13.5px;flex-wrap:wrap}
.auth-foot{color:#8E96C8;font-size:12.5px}
.sync{display:inline-flex;align-items:center;gap:7px;color:#C4CAF0;font-weight:700}
.sync i{width:8px;height:8px;border-radius:50%;background:#4CC9A0;flex:none}
.sync[data-st="saving"] i{background:var(--amarelo)}
.sync[data-st="erro"] i{background:#FF8A80}
.who b{font-size:14px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:10px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:90}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1100px){
  .track{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .rub-head{display:none}
  .rub{grid-template-columns:minmax(0,1fr) minmax(0,1fr);padding-right:8px}
  .rub .icon-btn{justify-self:end}
  .ind-layout{grid-template-columns:1fr}
}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;z-index:30;height:auto;flex-direction:row;align-items:center;gap:12px;padding:10px 12px;overflow-x:auto}
  .brand{padding:0;flex:none}.brand-name{display:none}.brand-logo{max-height:30px;max-width:120px}.brand-slot{height:32px;font-size:11px}
  .nav{flex-direction:row}
  .nav button{white-space:nowrap;padding:8px 10px}
  .nav button[aria-current="page"]::before{display:none}
  .nav button[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--amarelo)}
  .nav-sep,.side-foot{display:none}
  .top{position:static}
  .g2,.g3{grid-template-columns:1fr}
  .strip{grid-template-columns:1fr 1fr}
  .strip>div:nth-child(3){border-left:0}
  .strip>div:nth-child(n+3){border-top:1px solid var(--line)}
  .form-sec{grid-template-columns:1fr;gap:12px}
  .track{grid-template-columns:1fr}
  .facts{grid-template-columns:1fr 1fr}
  .rs-cols{grid-template-columns:1fr}
  .view,.ribbon,.top{padding-left:16px;padding-right:16px}
  .cal .d{min-height:64px}
  .cal .ev{font-size:0;height:6px;padding:0}
  .cal .ev.pend{height:6px}
  .ribbon-big{font-size:28px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  .side,.top-right,.no-print,.filters,#toast{display:none!important}
  .app{display:block}
  body{background:#fff;color:#000}
  .card,.strip{box-shadow:none;break-inside:avoid}
  .top{position:static;border:0}
  .rep-head{display:block;margin-bottom:10px}
}
</style>

function migrate(s){
  s.config=Object.assign(configPadrao(),s.config||{});
  ['equipe','orcamento','projetos'].forEach(k=>{if(!Array.isArray(s[k]))s[k]=[];});
  if(!s.equipe.length)s.equipe=[{id:'u1',nome:'Gestor(a) da área',papel:'gestor'}];
  if(!s.equipe.some(u=>u.id===s.usuario))s.usuario=s.equipe[0].id;
  if(!s.anoAtivo)s.anoAtivo=new Date().getFullYear();
  s.projetos.forEach(p=>{
    if(p.pequenaDespesa){(p.rubricas||[]).forEach(r=>{r.pd=true;if(!r.periodo)r.periodo=p.mesPD||(p.datas&&p.datas.inicio||'').slice(0,7);});}
    delete p.pequenaDespesa;delete p.mesPD;
    p.datas=p.datas||{assinatura:'',inicio:'',fim:''};p.rubricas=p.rubricas||[];p.pendencias=p.pendencias||[];p.historico=p.historico||[];p.localidades=p.localidades||[];p.responsaveis=p.responsaveis||[];});
  return s;
}

const fimEvento=p=>p.datas.fim||p.datas.inicio;
const indDevido=p=>ativo(p)&&!!fimEvento(p)&&fimEvento(p)<=today();
function saude(p){
  if(p.etapa==='Cancelado')return{k:'neutral',t:'Cancelado'};
  const x=proxPend(p);
  if(!x)return{k:'ok',t:p.etapa==='Concluído'?'Concluído':'Em dia'};
  const d=diffDays(today(),x.data);
  if(d<0)return{k:'bad',t:`Atrasado ${-d} dia${d<-1?'s':''}`};
  if(d===0)return{k:'warn',t:'Vence hoje'};
  if(d<=7)return{k:'warn',t:`Vence em ${d} dia${d>1?'s':''}`};
  return{k:'ok',t:'Em dia'};
}
function syncAuto(p,cfg){
  cfg=cfg||S.config;
  const base={assinatura:p.datas.assinatura,inicio:p.datas.inicio,fim:p.datas.fim||p.datas.inicio};
  cfg.pendPadrao.forEach(t=>{
    const b=base[t.gatilho];let ex=p.pendencias.find(x=>x.tpl===t.id);
    if(!b){if(ex&&!ex.feita)p.pendencias=p.pendencias.filter(x=>x!==ex);return;}
    const data=addDays(b,+t.dias||0);
    if(!ex){ex={id:uid(),tpl:t.id,titulo:t.titulo,data,feita:false,auto:true,obrigatoria:!!t.indicadores};p.pendencias.push(ex);}
    else if(!ex.feita){ex.data=data;ex.titulo=t.titulo;}
    if(t.indicadores)ex.feita=indPreenchido(p);
  });
}

function hbars(items,{fmt=brl,total=null}={}){
  const max=Math.max(...items.map(i=>i.v),1);
  if(!items.some(i=>i.v))return '<div class="empty">Sem valores para mostrar com estes filtros.</div>';
  return items.map(i=>`<div class="hbar"><span class="lb" title="${esc(i.label)}">${i.c?`<i class="dot" style="background:${i.c}"></i>`:''}${esc(i.label)}</span><span class="t"><i style="width:${i.v/max*100}%;background:${i.c||'var(--azul)'}"></i></span><span class="vv num">${fmt(i.v)}${total?`<small>${pctf(i.v/total)}</small>`:(i.sub?`<small>${esc(i.sub)}</small>`:'')}</span></div>`).join('');
}

  const dis=podeEditar(p)?'':'disabled';

}
function pdMeter(ym,extra=0,excl=null){
  const lim=S.config.limitePD,used=pdMes(ym,excl),tot=used+extra,saldo=lim-tot;
  const k=tot>lim?'bad':(tot>lim*.8?'warn':'ink');
  const wUsed=Math.min(used/lim,1)*100,wExtra=Math.max(0,Math.min(extra/lim,1-used/lim))*100;
  return `<div class="pdm"><div class="pdm-nums"><div><span class="lbl">${extra?'Saldo restante após este projeto':'Saldo restante'} em ${fmes(ym)}</span><b class="num" style="color:var(--${k})">${brl(saldo)}</b></div><div class="pdm-r">limite de ${brl(lim)} por mês</div></div>
  <div class="bar thin">${wUsed?`<span style="width:${wUsed}%;background:var(--azul)"></span>`:''}${wExtra?`<span style="width:${wExtra}%;background:var(--amarelo)"></span>`:''}</div>
  <div class="pdm-l"><span><i class="dot" style="background:var(--azul)"></i>Já comprometido ${brl(used)}</span>${extra?`<span><i class="dot" style="background:var(--amarelo);outline:1px solid var(--line)"></i>Este projeto ${brl(extra)}</span>`:''}${tot>lim?`<span style="color:var(--bad);font-weight:800">Ultrapassa o limite em ${brl(tot-lim)}</span>`:''}</div></div>`;
}

/* ---------- projetos ---------- */
function noMes(p,ym){
  if(p.rubricas.some(r=>mesRub(p,r)===ym))return true;
  const a=p.datas.inicio,b=fimEvento(p);if(!a)return false;
  return a.slice(0,7)<=ym&&b.slice(0,7)>=ym;
}
function filtrar(list,f){
  const q=(f.q||'').toLowerCase().trim();
  return list.filter(p=>{
    if(f.meus&&!mine(p))return false;
    if(q&&!(p.nome+' '+p.descricao+' '+p.demandante+' '+p.rubricas.map(r=>r.obs).join(' ')).toLowerCase().includes(q))return false;
    if(f.nat&&!p.rubricas.some(r=>r.natureza===f.nat))return false;
    if(f.uf&&!p.localidades.includes(f.uf))return false;
    if(f.dem&&p.demandante!==f.dem)return false;
    if(f.resp&&!p.responsaveis.includes(f.resp))return false;
    if(f.etapa&&p.etapa!==f.etapa)return false;
    if(f.pd==='sim'&&!(f.mes?valorPD(p,f.mes)>0:temPD(p)))return false;
    if(f.pd==='nao'&&temPD(p))return false;
    if(f.mes&&!noMes(p,f.mes))return false;
    return true;});
}

/* Pequenas Despesas: marcadas por rubrica, com trava do limite mensal */
function maxPD(d,i){
  const r=d.rubricas[i],ym=mesRub(d,r);
  const outras=d.rubricas.reduce((a,x,j)=>a+(j!==i&&x.pd&&mesRub(d,x)===ym?(+x.valor||0):0),0);
  return Math.max(0,S.config.limitePD-pdMes(ym,d.id)-outras);
}
function rubAlert(d,i){
  const r=d.rubricas[i];if(!r.pd)return{html:'',bad:false};
  const ym=mesRub(d,r),max=maxPD(d,i),v=+r.valor||0;
  if(v>max)return{html:`Limite de Pequenas Despesas: em ${fmes(ym)} o máximo disponível é ${brl2(max)}.`,bad:true};
  return{html:`Pequenas Despesas em ${fmes(ym)}: saldo restante de ${brl2(max-v)} depois desta rubrica.`,bad:false};
}
function pdPanel(d){
  const meses=[...new Set(d.rubricas.filter(r=>r.pd).map(r=>mesRub(d,r)))].sort();
  if(!meses.length)return '';
  return `<div class="pdbox"><div class="pdbox-h"><b>Pequenas Despesas</b><span class="muted" style="font-size:13px">limite de ${brl(S.config.limitePD)} por mês, somando todos os projetos</span></div>
  ${meses.map(ym=>{const n=projsPDmes(ym).filter(p=>p.id!==d.id).length;
    return `<div class="pdm-block">${pdMeter(ym,valorPD(d,ym),d.id)}
    <p>${n?`Há ${n} outro${n>1?'s':''} projeto${n>1?'s':''} com Pequenas Despesas em ${fmes(ym)}.`:`Nenhum outro projeto com Pequenas Despesas em ${fmes(ym)}.`} <button class="link" data-act="pd-list" data-ym="${ym}">Consultar todos os projetos de Pequenas Despesas do mês</button></p></div>`;}).join('')}</div>`;
}

function salvarForm(){
  const d=UI.form,err=[];
  d.nome=(d.nome||'').trim();
  if(!d.nome)err.push('Informe o nome do projeto.');
  if(!d.localidades.filter(Boolean).length)err.push('Escolha ao menos uma localidade.');
  if(!d.responsaveis.length)err.push('Indique ao menos um responsável.');
  else if(CLOUD&&!isGestor()&&!d.responsaveis.includes(S.usuario))err.push('Inclua você entre os responsáveis para poder salvar e acompanhar o projeto.');
  if(!d.rubricas.some(r=>+r.valor>0))err.push('Inclua ao menos uma rubrica com valor.');
  if(d.datas.inicio&&d.datas.fim&&d.datas.fim<d.datas.inicio)err.push('O término do evento não pode ser antes do início.');
  if(ativo(d))[...new Set(d.rubricas.filter(r=>r.pd).map(r=>mesRub(d,r)))].forEach(ym=>{
    const tot=pdMes(ym,d.id)+valorPD(d,ym);
    if(tot>S.config.limitePD)err.push(`Pequenas Despesas de ${fmes(ym)} chegariam a ${brl(tot)}, acima do limite de ${brl(S.config.limitePD)}. Ajuste o valor ou o período da rubrica.`);
  });
  if(err.length){UI.formErr=err;renderView();window.scrollTo({top:0,behavior:'smooth'});return;}
  d.localidades=d.localidades.filter(Boolean);
  d.rubricas=d.rubricas.filter(r=>+r.valor>0);
  d.rubricas.forEach(r=>{if(r.uf&&!d.localidades.includes(r.uf))r.uf='';});
  d.rubricas.forEach(r=>{if(r.pd&&!r.periodo)r.periodo=mesRub(d,r);r.pd=!!r.pd;});
  d.ano=+d.ano;
  const novo=!d.id;
  if(novo){d.id=uid();d.criadoEm=today();d.criadoPor=S.usuario;d.historico=[];log(d,'Projeto cadastrado');S.projetos.push(d);}
  else{log(d,'Dados do projeto atualizados');const i=S.projetos.findIndex(p=>p.id===d.id);S.projetos[i]=d;}
  syncAuto(d);persist();
  UI.form=null;UI.formErr=null;UI.demNew=false;UI.view='projetos';UI.drawer=d.id;
  if(d.ano!==S.anoAtivo)S.anoAtivo=d.ano;
  render();toast(novo?'Projeto cadastrado':'Alterações salvas');
}

/* ---------- indicadores ---------- */
function metricas(inv,i){
  i=i||{};const sg=i.seg||{};
  const seg=(+sg.instagram||0)+(+sg.youtube||0)+(+sg.linkedin||0);
  const pub=+i.publico||0,emp=+i.empregosDiretos||0,alc=+i.alcance||0,leads=+i.leads||0;
  return{inv,pub,emp,ei:+i.empregosIndiretos||0,seg,ig:+sg.instagram||0,yt:+sg.youtube||0,li:+sg.linkedin||0,alc,midia:+i.midia||0,leads,
    cpp:pub?inv/pub:null,cpe:emp?inv/emp:null,emp100:inv&&emp?emp/(inv/1e5):null,cps:seg?inv/seg:null,cpm:alc?inv/alc*1000:null,cpl:leads?inv/leads:null};
}
function mediaCarteira(excl){
  const ps=S.projetos.filter(p=>ativo(p)&&indPreenchido(p)&&p.id!==excl);
  const s={inv:0,pub:0,emp:0,seg:0,alc:0,leads:0,invPub:0,invEmp:0,invSeg:0,invAlc:0,invLeads:0};
  ps.forEach(p=>{const m=metricas(valor(p),p.indicadores);
    if(m.pub){s.pub+=m.pub;s.invPub+=m.inv;} if(m.emp){s.emp+=m.emp;s.invEmp+=m.inv;}
    if(m.seg){s.seg+=m.seg;s.invSeg+=m.inv;} if(m.alc){s.alc+=m.alc;s.invAlc+=m.inv;} if(m.leads){s.leads+=m.leads;s.invLeads+=m.inv;}});
  return{n:ps.length,cpp:s.pub?s.invPub/s.pub:null,cpe:s.emp?s.invEmp/s.emp:null,emp100:s.invEmp?s.emp/(s.invEmp/1e5):null,cps:s.seg?s.invSeg/s.seg:null,cpm:s.alc?s.invAlc/s.alc*1000:null,cpl:s.leads?s.invLeads/s.leads:null};
}
function cmpTxt(v,ref,lowerBetter=true){
  if(v==null)return '<div class="c muted">Preencha os dados para calcular</div>';
  if(ref==null||!ref)return '<div class="c muted">Sem base de comparação ainda</div>';
  const d=(v-ref)/ref;if(Math.abs(d)<.03)return '<div class="c muted">Na média da carteira</div>';
  const good=lowerBetter?d<0:d>0;
  return `<div class="c" style="color:var(--${good?'ok':'bad'})">${pctf(Math.abs(d))} ${d<0?'abaixo':'acima'} da média da carteira</div>`;
}
function calcHTML(p,draft){
  const m=metricas(valor(p),draft),md=mediaCarteira(p.id);
  const it=[['Investimento no projeto',brl(m.inv),'<div class="c muted">Soma das rubricas</div>'],
    ['Custo por participante',m.cpp!=null?brl2(m.cpp):'—',cmpTxt(m.cpp,md.cpp)],
    ['Investimento por emprego direto',m.cpe!=null?brl(m.cpe):'—',cmpTxt(m.cpe,md.cpe)],
    ['Empregos diretos por R$ 100 mil',m.emp100!=null?m.emp100.toLocaleString('pt-BR',{maximumFractionDigits:1}):'—',cmpTxt(m.emp100,md.emp100,false)],
    ['Custo por novo seguidor',m.cps!=null?brl2(m.cps):'—',cmpTxt(m.cps,md.cps)],
    ['Custo por mil pessoas alcançadas',m.cpm!=null?brl2(m.cpm):'—',cmpTxt(m.cpm,md.cpm)],
    ['Custo por contato comercial',m.cpl!=null?brl2(m.cpl):'—',cmpTxt(m.cpl,md.cpl)]];
  return `<div class="metrics">${it.map(([l,v,c])=>`<div class="metric"><div class="l">${l}</div><div class="v num">${v}</div>${c}</div>`).join('')}</div>
  <p class="hint" style="margin-top:10px">A média da carteira considera ${md.n} projeto${md.n===1?'':'s'} com indicadores preenchidos. Nos custos, ficar abaixo da média é melhor.</p>`;
}

let CLOUD=false,FBX=null,synced={},remote={},loaded=new Set(),unsubs=[],renderPending=false,started=false;
const AUTH={mode:'login',msg:'',email:'',err:''};
let LOGO_FILE=null;
const logoSrc=()=>(S&&S.config&&S.config.logo)||LOGO_FILE;
(function(){const im=new Image();im.onload=()=>{LOGO_FILE='logo-bbasset.png';if(S)render();};im.src='logo-bbasset.png';})();
const PREFS='bbasset-fluxo-prefs';
function prefs(){try{return JSON.parse(localStorage.getItem(PREFS)||'{}');}catch(e){return{};}}
function savePrefs(o){try{localStorage.setItem(PREFS,JSON.stringify(Object.assign(prefs(),o)));}catch(e){}}
function stable(v){
  if(Array.isArray(v))return '['+v.map(stable).join(',')+']';
  if(v&&typeof v==='object')return '{'+Object.keys(v).filter(k=>v[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+stable(v[k])).join(',')+'}';
  return JSON.stringify(v===undefined?null:v);
}
const cfgGeral=c=>({limitePD:c.limitePD,demandantes:c.demandantes,pendPadrao:c.pendPadrao});
function cloudDocs(){
  const o={};
  S.projetos.forEach(p=>o['projetos/'+p.id]=p);
  S.orcamento.forEach(x=>o['orcamento/'+x.id]=x);
  S.equipe.forEach(u=>o['equipe/'+u.id]={nome:u.nome,papel:u.papel,usuario:u.usuario||loginDe(u.id)});
  o['config/geral']=cfgGeral(S.config);
  if(S.config.logo)o['config/logo']={src:S.config.logo};
  return o;
}
function setSync(st){const el=$('#sync');if(!el)return;el.dataset.st=st;el.lastChild.textContent={ok:'Sincronizado',saving:'Salvando…',erro:'Erro ao salvar'}[st]||'';}
function cloudPersist(){
  const{F,db}=FBX,now=cloudDocs(),ops=[];
  for(const[path,obj]of Object.entries(now)){const s=stable(obj);if(synced[path]!==s){ops.push(['set',path,obj]);synced[path]=s;}}
  for(const path of Object.keys(synced))if(!(path in now)){ops.push(['del',path]);delete synced[path];}
  if(!ops.length)return;
  setSync('saving');
  const lotes=[];for(let i=0;i<ops.length;i+=400)lotes.push(ops.slice(i,i+400));
  Promise.all(lotes.map(l=>{const b=F.writeBatch(db);l.forEach(([t,path,obj])=>{const ref=F.doc(db,path);if(t==='set')b.set(ref,JSON.parse(JSON.stringify(obj)));else b.delete(ref);});return b.commit();}))
    .then(()=>setSync('ok'))
    .catch(err=>{console.error(err);setSync('erro');
      toast(err&&err.code==='permission-denied'?'Sem permissão para esta alteração. Ela foi desfeita.':'Não foi possível salvar. Verifique a conexão.');
      stateFromRemote();render();});
}
function normProj(p,id){
  p=Object.assign({nome:'',ano:new Date().getFullYear(),etapa:'Prospecção',descricao:'',localidades:[],responsaveis:[],demandante:'',rubricas:[],progresso:0,pendencias:[],indicadores:null,historico:[]},p);
  p.datas=Object.assign({assinatura:'',inicio:'',fim:''},p.datas||{});p.id=id;return p;
}
function stateFromRemote(){
  const keys=pre=>Object.keys(remote).filter(k=>k.startsWith(pre)).sort();
  S.projetos=keys('projetos/').map(k=>normProj(clone(remote[k]),k.slice(9)));
  S.orcamento=keys('orcamento/').map(k=>Object.assign(clone(remote[k]),{id:k.slice(10)}));
  S.equipe=keys('equipe/').map(k=>({id:k.slice(7),nome:remote[k].nome||k.slice(7),papel:remote[k].papel==='gestor'?'gestor':'analista',usuario:remote[k].usuario||loginDe(k.slice(7))})).sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));
  S.config=Object.assign(configPadrao(),remote['config/geral']?clone(remote['config/geral']):{});
  if(remote['config/logo'])S.config.logo=remote['config/logo'].src;
  synced={};const docs=cloudDocs();
  for(const k of Object.keys(docs))if(remote[k]||k==='config/geral')synced[k]=stable(docs[k]);
}
function busy(){const a=document.activeElement;return !!(a&&a.matches&&a.matches('input,textarea,select')&&!a.matches('[data-ano],[type=range],[type=checkbox]'));}
function scheduleRender(){if(busy()){renderPending=true;return;}renderPending=false;render();}
document.addEventListener('focusout',()=>setTimeout(()=>{if(renderPending&&!busy())scheduleRender();},200));
function blankCloud(email){return{versao:1,exemplo:false,usuario:email,anoAtivo:prefs().ano||new Date().getFullYear(),config:configPadrao(),equipe:[],orcamento:[],projetos:[]};}
function stopCloud(){unsubs.forEach(u=>{try{u();}catch(e){}});unsubs=[];started=false;}
function startCloud(){
  const{F,db}=FBX;stopCloud();synced={};remote={};loaded=new Set();
  ['projetos','orcamento','equipe','config'].forEach(name=>{
    unsubs.push(F.onSnapshot(F.collection(db,name),snap=>{
      Object.keys(remote).forEach(k=>{if(k.startsWith(name+'/'))delete remote[k];});
      snap.docs.forEach(d=>{remote[name+'/'+d.id]=d.data();});
      loaded.add(name);if(loaded.size<4)return;
      stateFromRemote();
      if(!S.equipe.some(u=>u.id===S.usuario)){stopCloud();authScreen('semacesso');return;}
      if(!started){
        started=true;const g=isGestor();UI.view='painel';UI.f.meus=!g;UI.acomp.meus=!g;UI.calf.meus=!g;
        if(g&&!remote['config/geral']){delete synced['config/geral'];persist();}
        render();
      }else scheduleRender();
    },err=>{console.error(err);
      if(err&&err.code==='permission-denied'){stopCloud();authScreen('semacesso');}
      else toast('Conexão instável. As alterações serão sincronizadas quando a conexão voltar.');}));
  });
}

function diagErro(e){const c=String(e&&e.code||''),m=String(e&&e.message||'');
  if(c==='permission-denied')return 'O banco recusou o acesso. Confira se as regras do arquivo firestore.rules foram coladas e publicadas no Firestore, na aba Regras.';

const semAc=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase();

function aplicarImport(modo){
  const d=UI.importData;if(!d)return;UI.importData=null;
  const porNome={},porPrimeiro={};
  S.equipe.forEach(u=>{porNome[semAc(u.nome)]=u.id;const p=semAc(u.nome).split(' ')[0];porPrimeiro[p]=porPrimeiro[p]===undefined?u.id:null;});
  const mapa=id=>{
    if(S.equipe.some(x=>x.id===id))return id;
    const u=d.equipe.find(x=>x.id===id);if(!u)return undefined;
    const n=semAc(u.nome);return porNome[n]||porPrimeiro[n.split(' ')[0]]||undefined;
  };
  const semPar=new Set();
  const atuais=new Set(S.projetos.map(p=>p.id));
  let pulados=0;
  const novos=[];
  d.projetos.forEach(p=>{
    if(modo==='somar'&&atuais.has(p.id)){pulados++;return;}
    p.responsaveis=(p.responsaveis||[]).map(id=>{const m=mapa(id);if(!m)semPar.add((d.equipe.find(x=>x.id===id)||{}).nome||id);return m;}).filter(Boolean);
    p.responsaveis=[...new Set(p.responsaveis)];
    if(!p.responsaveis.length)p.responsaveis=[S.usuario];
    p.historico=(p.historico||[]).map(h=>Object.assign(h,{por:mapa(h.por)||S.usuario}));
    p.criadoPor=mapa(p.criadoPor)||S.usuario;
    if(p.indicadores)p.indicadores.por=mapa(p.indicadores.por)||S.usuario;
    novos.push(p);
  });
  if(modo==='substituir'){S.projetos=novos;S.orcamento=d.orcamento;}
  else{
    S.projetos=S.projetos.concat(novos);
    const anos=new Set(S.orcamento.map(o=>o.ano));
    S.orcamento=S.orcamento.concat(d.orcamento.filter(o=>!anos.has(o.ano)));
  }
  S.config.demandantes=[...new Set([...S.config.demandantes,...(d.config.demandantes||[])])];
  if(d.config.logo&&!S.config.logo)S.config.logo=d.config.logo;
  if(d.anoAtivo){S.anoAtivo=d.anoAtivo;savePrefs({ano:S.anoAtivo});}
  persist();UI.form=null;go('painel');
  const partes=[`${novos.length} projetos importados`];
  if(pulados)partes.push(`${pulados} já existiam e foram mantidos`);
  if(semPar.size)partes.push(`sem correspondência na equipe: ${[...semPar].join(', ')}`);
  toast(partes.join('. '));
}

function linhas(projs){
  const out=[];
  projs.forEach(p=>p.rubricas.forEach(r=>{const v=+r.valor||0,mes=(r.periodo||p.datas.inicio||'').slice(0,7);
    if(r.uf)out.push({p,r,nat:r.natureza,uf:r.uf,v,mes});
    else{const L=p.localidades.length?p.localidades:['—'];L.forEach(u=>out.push({p,r,nat:r.natureza,uf:u,v:v/L.length,mes}));}}));
  return out;
}
function donut(segs,center){
  const tot=segs.reduce((a,s)=>a+s.v,0);const cx=90,cy=90,R=74,r=48;let a0=-Math.PI/2,paths='';
  if(!tot)paths=`<circle cx="90" cy="90" r="61" fill="none" stroke="var(--surface-2)" stroke-width="26"/>`;
  segs.filter(s=>s.v>0).forEach(s=>{
    if(s.v/tot>.9999){paths+=`<circle cx="90" cy="90" r="61" fill="none" stroke="${s.c}" stroke-width="26"/>`;return;}
    const a1=a0+s.v/tot*Math.PI*2,lg=(a1-a0)>Math.PI?1:0,P=(a,rad)=>`${(cx+rad*Math.cos(a)).toFixed(2)} ${(cy+rad*Math.sin(a)).toFixed(2)}`;
    paths+=`<path d="M${P(a0,R)}A${R} ${R} 0 ${lg} 1 ${P(a1,R)}L${P(a1,r)}A${r} ${r} 0 ${lg} 0 ${P(a0,r)}Z" fill="${s.c}" stroke="var(--surface)" stroke-width="2"><title>${esc(s.label)}: ${brl(s.v)}</title></path>`;a0=a1;});
  return `<svg viewBox="0 0 180 180" width="180" height="180" role="img" aria-label="Distribuição por natureza">${paths}<text x="90" y="90" text-anchor="middle" class="dn-v">${center[0]}</text><text x="90" y="108" text-anchor="middle" class="dn-l">${center[1]}</text></svg>`;
}
function columns(data,{limit=0,h=230,W=680}={}){

}

/* ---------- orçamento global ---------- */
VIEW_FN.orcamento=function(){

    <div><div class="l">Saldo livre</div><div class="v num" style="${tot-comp<0?'color:var(--bad)':''}">${brl(tot-comp)}</div><div class="s">${tot?pctf((tot-comp)/tot)+' disponível':'—'}</div></div>

      ${ent.map(o=>{acc+=o.tipo==='reducao'?-o.valor:o.valor;return `<tr><td class="num">${fd(o.data)}</td><td>${pill(o.tipo==='reducao'?'bad':o.tipo==='aumento'?'ok':'neutral',TIPO[o.tipo])}</td><td>${esc(o.obs)||'—'}</td><td class="r num" style="font-weight:700">${o.tipo==='reducao'?'−':''}${brl(o.valor)}</td><td class="r num">${brl(acc)}</td>${g?`<td class="r"><button class="icon-btn" data-act="orc-del" data-id="${o.id}" aria-label="Excluir lançamento">×</button></td>`:''}</tr>`;}).join('')}
      </tbody></table></div>`:`<div class="empty"><b>Nenhum lançamento para ${ano}.</b>${g?'Comece pelo orçamento inicial do ano.':'A gestão ainda não lançou o orçamento deste ano.'}</div>`}</div>
    ${g?`<div class="card"><h2>Novo lançamento</h2><div class="grid g2" id="orc-form">
      <div class="field"><label for="o-ano">Ano</label><input id="o-ano" type="number" value="${ano}" min="2020" max="2100"></div>
      <div class="field"><label for="o-tipo">Tipo</label><select id="o-tipo">${ent.some(o=>o.tipo==='inicial')?'':opt('inicial','Orçamento inicial','inicial')}${opt('aumento','Aumento','')}${opt('reducao','Redução','')}</select></div>
      <div class="field"><label for="o-data">Data</label><input id="o-data" type="date" value="${today()}"></div>
      <div class="field"><label for="o-valor">Valor</label><input id="o-valor" type="text" inputmode="decimal" class="money num" placeholder="R$ 0,00"></div>
      <div class="field span2"><label for="o-obs">Justificativa</label><input id="o-obs" type="text" placeholder="Ex.: suplementação aprovada pela diretoria"></div>
      <div class="span2 row" style="justify-content:flex-end"><button class="btn primary" data-act="orc-add">Lançar no orçamento</button></div></div></div>`:
      `<div class="card"><h2>Como funciona</h2><p style="margin:0;color:var(--ink-2)">O orçamento total do ano é lançado pela gestão e pode receber aumentos ou reduções. Todos os projetos abatem desse total, e os relatórios mostram quanto já foi comprometido.</p></div>`}
  </div>
  <div class="card mt"><h2>Comprometido por natureza<small>em relação ao orçamento vigente</small></h2>${hbars(NAT.map(x=>({label:x.nome,v:pn[x.id],c:x.cor})),{total:tot||1})}</div>`;
};

/* ---------- arquivos ---------- */
function download(name,text,mime){const b=new Blob([text],{type:mime});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
const csvCell=v=>{v=v==null?'':String(v);return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
const numBR=v=>(+v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2,useGrouping:false});
function csvProjetos(){
  const list=UI.view==='projetos'?filtrar(projAno(),UI.f):projAno();
  const head=['Projeto','Ano','Etapa','Área demandante','Localidades','Responsáveis','Naturezas','Valor','Pequenas Despesas (valor)','Meses de Pequenas Despesas','Assinatura','Início','Término','Progresso %','Próxima pendência','Data da pendência','Público','Empregos diretos','Novos seguidores'];
  const rows=list.map(p=>{const x=proxPend(p),m=metricas(valor(p),p.indicadores);return[p.nome,p.ano,p.etapa,p.demandante,p.localidades.join(', '),p.responsaveis.map(nome).join(', '),natsDoProjeto(p).map(n=>NATMAP[n].nome).join(', '),numBR(valor(p)),numBR(valorPD(p)),mesesPD(p).join(', '),fd(p.datas.assinatura),fd(p.datas.inicio),fd(p.datas.fim),p.progresso,x?x.titulo:'',x?fd(x.data):'',indPreenchido(p)?m.pub:'',indPreenchido(p)?m.emp:'',indPreenchido(p)?m.seg:''];});
  download(`projetos-${S.anoAtivo}.csv`,'\ufeff'+[head,...rows].map(r=>r.map(csvCell).join(';')).join('\n'),'text/csv;charset=utf-8');
}
function csvRubricas(){
  const head=['Projeto','Etapa','Área demandante','Natureza','Localidade','Período','Origem','Valor','Pequenas Despesas'];
  const rows=[];projAno().forEach(p=>p.rubricas.forEach(r=>rows.push([p.nome,p.etapa,p.demandante,NATMAP[r.natureza].nome,r.uf||'Todas',r.periodo,r.obs,numBR(r.valor),r.pd?'Sim':'Não'])));
  download(`rubricas-${S.anoAtivo}.csv`,'\ufeff'+[head,...rows].map(r=>r.map(csvCell).join(';')).join('\n'),'text/csv;charset=utf-8');
}

/* ---------- ações ---------- */
function proj(id){return S.projetos.find(p=>p.id===id);}
function go(v){UI.view=v;if(v==='novo'&&!UI.form)UI.form=newDraft();UI.drawer=null;UI.modal=null;render();window.scrollTo(0,0);}
const ACT={
  go:t=>go(t.dataset.v),
  novo:()=>{if(!UI.form||UI.form.id){UI.form=newDraft();UI.formErr=null;}go('novo');},
  open:t=>{UI.drawer=t.dataset.id;UI.modal=null;renderOverlay();},
  'close-drawer':()=>{UI.drawer=null;renderOverlay();},
  'close-modal':()=>{UI.modal=null;renderOverlay();},
  'close-overlay':(t,e)=>{if(e.target===t){if(UI.modal)UI.modal=null;else UI.drawer=null;renderOverlay();}},
  edit:t=>{const p=proj(t.dataset.id);UI.form=clone(p);if(!UI.form.localidades.length)UI.form.localidades=[''];UI.formErr=null;go('novo');},
  dup:t=>{const p=clone(proj(t.dataset.id));Object.assign(p,{id:null,nome:p.nome+' (cópia)',pendencias:[],indicadores:null,progresso:0,historico:[],etapa:'Prospecção'});p.rubricas.forEach(r=>r.id=uid());UI.form=p;UI.formErr=null;go('novo');toast('Cópia aberta no cadastro. Ajuste e salve.');},
  del:t=>{const p=proj(t.dataset.id);if(!confirm(`Excluir o projeto “${p.nome}”? Esta ação não pode ser desfeita.`))return;S.projetos=S.projetos.filter(x=>x.id!==p.id);persist();UI.drawer=null;render();toast('Projeto excluído');},
  'loc-add':()=>{UI.form.localidades.push('');renderView();},
  'loc-del':t=>{const d=UI.form,uf=d.localidades[+t.dataset.i];d.localidades.splice(+t.dataset.i,1);d.rubricas.forEach(r=>{if(r.uf===uf)r.uf='';});renderView();},
  'rub-add':()=>{const d=UI.form,last=d.rubricas[d.rubricas.length-1];d.rubricas.push({id:uid(),natureza:last?last.natureza:'promo',uf:'',valor:0,obs:'',periodo:last?last.periodo:''});renderView();},
  'rub-del':t=>{UI.form.rubricas.splice(+t.dataset.i,1);renderView();},
  'dem-new-save':()=>{const v=($('#dem-new')?.value||'').trim();if(!v){$('#dem-new')?.focus();return;}if(!S.config.demandantes.includes(v)){S.config.demandantes.push(v);persist();}UI.form.demandante=v;UI.demNew=false;renderView();toast('Área demandante adicionada');},
  'dem-new-cancel':()=>{UI.demNew=false;renderView();},
  'form-save':()=>salvarForm(),
  'form-cancel':()=>{const id=UI.form&&UI.form.id;UI.form=null;UI.formErr=null;UI.demNew=false;if(id){UI.view='projetos';render();UI.drawer=id;renderOverlay();}else go('painel');},
  'form-reset':()=>{UI.form=newDraft();UI.formErr=null;renderView();},
  'pd-list':t=>{UI.modal={type:'pd',ym:t.dataset.ym};renderOverlay();},
  'pd-filter':t=>{UI.f=Object.assign(UI.f,{pd:'sim',mes:t.dataset.ym,meus:false,q:'',nat:'',uf:'',dem:'',resp:'',etapa:''});UI.modal=null;go('projetos');},
  'pend-toggle':t=>{const p=proj(t.dataset.id),x=p.pendencias.find(z=>z.id===t.dataset.pid);x.feita=!x.feita;log(p,`Pendência “${x.titulo}” ${x.feita?'concluída':'reaberta'}`);persist();render();},
  'pend-add':t=>{const box=t.closest('.pend-add'),ti=box.querySelector('input[type=text]'),dt=box.querySelector('input[type=date]');
    if(!ti.value.trim()){ti.focus();toast('Descreva a pendência');return;}if(!dt.value){dt.focus();toast('Informe a data da pendência');return;}
    const p=proj(t.dataset.id);p.pendencias.push({id:uid(),titulo:ti.value.trim(),data:dt.value,feita:false});log(p,`Pendência “${ti.value.trim()}” criada para ${fd(dt.value)}`);persist();render();toast('Pendência adicionada');},
  'pend-del':t=>{const p=proj(t.dataset.id),x=p.pendencias.find(z=>z.id===t.dataset.pid);p.pendencias=p.pendencias.filter(z=>z!==x);log(p,`Pendência “${x.titulo}” excluída`);persist();render();},
  'acomp-exp':t=>{UI.exp[t.dataset.id]=!UI.exp[t.dataset.id];renderView();},
  seg:t=>{UI[t.dataset.o][t.dataset.k]=JSON.parse(t.dataset.val);renderView();},
  'clear-f':()=>{UI.f={q:'',nat:'',uf:'',dem:'',resp:'',etapa:'',pd:'todos',mes:'',meus:false};renderView();},
  'ind-go':t=>{UI.indSel=t.dataset.id;UI.indDraft=null;const p=proj(t.dataset.id);UI.indF=indPreenchido(p)?'ok':indDevido(p)?'pend':'fut';go('indicadores');},
  'ind-sel':t=>{UI.indSel=t.dataset.id;UI.indDraft=null;renderView();if(innerWidth<1100)$('#indform')?.scrollIntoView({behavior:'smooth'});},
  'ind-f':t=>{UI.indF=t.dataset.k;renderView();},
  'ind-save':t=>{const p=proj(t.dataset.id),d=UI.indDraft;
    if(d.publico===''||d.publico==null){toast('Informe o público do evento');$('[data-ind="publico"]')?.focus();return;}
    const num=v=>v===''||v==null?0:Math.max(0,+v);
    p.indicadores={publico:num(d.publico),empregosDiretos:num(d.empregosDiretos),empregosIndiretos:num(d.empregosIndiretos),seg:{instagram:num(d.seg.instagram),youtube:num(d.seg.youtube),linkedin:num(d.seg.linkedin)},alcance:num(d.alcance),midia:num(d.midia),leads:num(d.leads),obs:d.obs||'',preenchidoEm:today(),por:S.usuario};
    syncAuto(p);log(p,'Indicadores registrados');persist();UI.indDraft=null;render();toast('Indicadores salvos');},
  'cal-mv':t=>{const[y,m]=UI.cal.split('-').map(Number);const d=new Date(y,m-1+(+t.dataset.n),1);UI.cal=iso(d).slice(0,7);renderView();},
  'cal-today':()=>{UI.cal=today().slice(0,7);UI.calSel=today();renderView();},
  'cal-day':t=>{UI.calSel=t.dataset.d;renderView();},
  'rel-clear':()=>{UI.rel={nat:'',dem:'',uf:'',resp:'',etapa:''};renderView();},
  print:()=>window.print(),
  'csv-proj':()=>csvProjetos(),
  'csv-rub':()=>csvRubricas(),
  'orc-add':()=>{const ano=+$('#o-ano').value,tipo=$('#o-tipo').value,data=$('#o-data').value,v=parseValor($('#o-valor').value),obs=$('#o-obs').value.trim();
    if(!ano||!data||!v){toast('Preencha ano, data e valor');return;}
    if(tipo==='inicial'&&S.orcamento.some(o=>o.ano===ano&&o.tipo==='inicial')){toast(`${ano} já tem orçamento inicial. Use aumento ou redução.`);return;}
    S.orcamento.push({id:uid(),ano,data,tipo,valor:v,obs});S.anoAtivo=ano;persist();render();toast('Lançamento registrado');},
  'orc-del':t=>{if(!confirm('Excluir este lançamento do orçamento?'))return;S.orcamento=S.orcamento.filter(o=>o.id!==t.dataset.id);persist();render();},
  'eq-add':()=>{const n=$('#eq-nome').value.trim();if(!n){$('#eq-nome').focus();return;}let id=uid();
    const papel=$('#eq-papel').value;
    if(CLOUD){const l=normLogin($('#eq-login').value),sn=$('#eq-senha').value;
      if(!loginValido(l)){toast('Usuário: de 3 a 30 caracteres, só letras minúsculas, números, ponto, hífen ou sublinhado');$('#eq-login').focus();return;}
      if(sn.length<6){toast('A senha inicial precisa ter pelo menos 6 caracteres');$('#eq-senha').focus();return;}
      id=loginEmail(l);if(S.equipe.some(u=>u.id===id)){toast('Este usuário já está na equipe');return;}
      const bt=$('[data-act="eq-add"]');bt.disabled=true;
      criarLogin(l,sn).then(r=>{
        if(r==='existe'&&!confirm(`O usuário "${l}" já existiu no sistema. Reativar o acesso? A senha continua a antiga; para trocar, use Nova senha.`)){bt.disabled=false;return;}
        S.equipe.push({id,nome:n,papel,usuario:l});persist();render();toast(`${n} incluído. Passe o usuário ${l} e a senha inicial para a pessoa.`);
      }).catch(e=>{bt.disabled=false;toast(authMsg(e));});
      return;}
    S.equipe.push({id,nome:n,papel});persist();render();toast('Pessoa adicionada');},
  'eq-del':t=>{const id=t.dataset.id;if(CLOUD&&id===S.usuario){toast('Você não pode remover o próprio acesso');return;}if(S.equipe.filter(u=>u.papel==='gestor'&&u.id!==id).length===0){toast('Mantenha ao menos uma pessoa com perfil de gestão');return;}
    if(!confirm(`Remover ${nome(id)} da equipe? Os projetos continuam, mas sem essa pessoa como responsável.`))return;
    S.equipe=S.equipe.filter(u=>u.id!==id);S.projetos.forEach(p=>p.responsaveis=p.responsaveis.filter(x=>x!==id));if(S.usuario===id)S.usuario=S.equipe.find(u=>u.papel==='gestor').id;persist();render();},
  'dem-add':()=>{const v=$('#dem-add').value.trim();if(!v||S.config.demandantes.includes(v))return;S.config.demandantes.push(v);persist();render();},
  'dem-del':t=>{S.config.demandantes.splice(+t.dataset.i,1);persist();render();},
  'pp-add':()=>{S.config.pendPadrao.push({id:uid(),titulo:'Nova pendência',gatilho:'fim',dias:7});persist();render();},
  'pp-del':t=>{S.config.pendPadrao.splice(+t.dataset.i,1);persist();render();},
  'pp-apply':()=>{S.projetos.forEach(p=>syncAuto(p));persist();render();toast('Regras aplicadas aos projetos');},
  'export-json':()=>{download(`backup-projetos-bbasset-${today()}.json`,JSON.stringify(S,null,1),'application/json');toast('Cópia exportada');},
  'import-json':()=>$('#import-file').click(),
  'imp-somar':()=>{UI.modal=null;aplicarImport('somar');},
  'imp-subst':()=>{if(!confirm('Apagar os projetos e o orçamento atuais e ficar só com os do arquivo?'))return;UI.modal=null;aplicarImport('substituir');},
  'logo-pick':()=>$('#logo-file').click(),
  'logo-del':()=>{if(!confirm('Remover o logotipo?'))return;delete S.config.logo;persist();render();},
  'load-demo':()=>{if(CLOUD)return;if(!confirm('Substituir os dados atuais pelos dados de exemplo?'))return;S=demo();persist();UI.form=null;go('painel');},
  'reset-all':()=>{if(CLOUD){if(!isGestor())return;if(!confirm('Apagar todos os projetos e lançamentos de orçamento da nuvem para toda a equipe? Exporte uma cópia antes.'))return;if(prompt('Para confirmar, digite APAGAR')!=='APAGAR')return;S.projetos=[];S.orcamento=[];persist();go('painel');toast('Projetos e orçamento apagados');return;}
    if(!confirm('Apagar todos os projetos, lançamentos e configurações? Exporte uma cópia antes, se precisar.'))return;S=blank();persist();UI.form=null;UI.f.meus=false;UI.acomp.meus=false;go('config');toast('Tudo apagado. Comece cadastrando a equipe e o orçamento.');}
};
Object.assign(ACT,AUTH_ACT);
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const a=ACT[t.dataset.act];if(!a)return;if(t.dataset.act==='close-overlay'&&e.target!==t)return;a(t,e);});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.matches('.auth input')){e.preventDefault();$('.auth .btn.primary')?.click();return;}
  if(e.key==='Escape'&&(UI.drawer||UI.modal)){if(UI.modal)UI.modal=null;else UI.drawer=null;renderOverlay();}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('.cal .d')){e.preventDefault();UI.calSel=e.target.dataset.d;renderView();}
});
function onField(e){
  const t=e.target,ds=t.dataset;
  if(ds.f!==undefined&&UI.form){
    const d=UI.form,k=ds.f;
    if(k==='demandante'&&t.value==='__novo'){if(e.type==='change'){UI.demNew=true;renderView();$('#dem-new')?.focus();}return;}
    let v=t.type==='checkbox'?t.checked:t.value;if(k==='ano')v=+v;
    const parts=k.split('.');let o=d;while(parts.length>1)o=o[parts.shift()];o[parts[0]]=v;
    if(k!=='nome'&&k!=='descricao')refreshFormCalc();
    return;}
  if(ds.loc!==undefined&&e.type==='change'){UI.form.localidades[+ds.loc]=t.value;renderView();return;}
  if(ds.rub!==undefined&&UI.form){const d=UI.form,i=+ds.rub,r=d.rubricas[i];
    if(ds.rf==='pd'){if(e.type!=='change')return;
      r.pd=t.checked;
      if(r.pd){if(!r.periodo)r.periodo=(d.datas.inicio||today()).slice(0,7);
        const max=maxPD(d,i),ym=mesRub(d,r);
        if(max<=0){r.pd=false;toast(`Sem saldo de Pequenas Despesas em ${fmes(ym)}`);}
        else if((+r.valor||0)>max){r.valor=max;toast(`Valor travado em ${brl2(max)}, o saldo de Pequenas Despesas em ${fmes(ym)}`);}}
      renderView();return;}
    if(ds.rf==='valor'){r.valor=parseValor(t.value);
      if(r.pd){const max=maxPD(d,i);if(r.valor>max){r.valor=max;t.value=fmtInput(max);toast(`Limite de Pequenas Despesas: máximo de ${brl2(max)} em ${fmes(mesRub(d,r))}`);}}
      if(e.type==='change')t.value=fmtInput(r.valor);}
    else r[ds.rf]=t.value;
    if(ds.rf==='periodo'&&r.pd&&e.type==='change'){if(!r.periodo)r.periodo=(d.datas.inicio||today()).slice(0,7);const max=maxPD(d,i);if((+r.valor||0)>max){r.valor=max;toast(`Valor ajustado ao saldo de Pequenas Despesas em ${fmes(mesRub(d,r))}: ${brl2(max)}`);}renderView();return;}
    if(ds.rf==='natureza')t.closest('.rub').style.setProperty('--c',NATMAP[t.value].cor);
    refreshFormCalc();return;}
  if(ds.resp!==undefined&&e.type==='change'){const d=UI.form;d.responsaveis=t.checked?[...new Set([...d.responsaveis,ds.resp])]:d.responsaveis.filter(x=>x!==ds.resp);t.closest('.chip').classList.toggle('on',t.checked);return;}
  if(ds.slider!==undefined){$$(`[data-pctout="${ds.slider}"]`).forEach(o=>o.textContent=t.value+'%');
    if(e.type==='change'){const p=proj(ds.slider);p.progresso=+t.value;log(p,`Progresso atualizado para ${t.value}%`);persist();render();}return;}
  if(ds.etapa!==undefined&&e.type==='change'){const p=proj(ds.etapa);log(p,`Etapa alterada de ${p.etapa} para ${t.value}`);p.etapa=t.value;persist();render();toast('Etapa atualizada');return;}
  if(ds.filter!==undefined){UI.f[ds.filter]=t.value;if(ds.filter==='q'){const l=$('#plist');if(l)l.innerHTML=projList();}else if(e.type==='change')renderView();return;}
  if(ds.acf!==undefined&&e.type==='change'){UI.acomp[ds.acf]=t.type==='checkbox'?t.checked:t.value;renderView();return;}
  if(ds.calf!==undefined&&e.type==='change'){UI.calf[ds.calf]=t.type==='checkbox'?t.checked:t.value;renderView();return;}
  if(ds.rel!==undefined&&e.type==='change'){UI.rel[ds.rel]=t.value;renderView();return;}
  if(ds.ind!==undefined&&UI.indDraft){const k=ds.ind.split('.');if(k.length>1)UI.indDraft[k[0]][k[1]]=t.value;else UI.indDraft[k[0]]=t.value;
    const p=proj(UI.indSel),c=$('#indcalc');if(p&&c&&ds.ind!=='obs')c.innerHTML=calcHTML(p,UI.indDraft);return;}
  if(ds.ano!==undefined&&e.type==='change'){S.anoAtivo=+t.value;savePrefs({ano:S.anoAtivo});if(!CLOUD)persist();render();return;}
  if(ds.who!==undefined&&e.type==='change'){S.usuario=t.value;const g=isGestor();UI.f.meus=!g;UI.acomp.meus=!g;UI.calf.meus=!g;persist();render();toast(`Perfil: ${user().nome} (${g?'gestão':'analista'})`);return;}
  if(ds.cfg!==undefined&&e.type==='change'){const v=parseValor(t.value);if(v>0){S.config[ds.cfg]=v;t.value=fmtInput(v);persist();render();toast('Limite atualizado');}return;}
  if(ds.eq!==undefined&&e.type==='change'){const u=S.equipe.find(x=>x.id===ds.eq);
    if(ds.eqf==='papel'&&t.value!=='gestor'&&!S.equipe.some(x=>x.papel==='gestor'&&x.id!==u.id)){toast('Mantenha ao menos uma pessoa com perfil de gestão');t.value='gestor';return;}
    u[ds.eqf]=ds.eqf==='nome'?(t.value.trim()||u.nome):t.value;persist();render();return;}
  if(ds.pp!==undefined&&e.type==='change'){const r=S.config.pendPadrao[+ds.pp];r[ds.ppf]=ds.ppf==='dias'?Math.max(0,+t.value||0):t.value;persist();return;}
}
document.addEventListener('input',onField);
document.addEventListener('change',onField);
$('#import-file').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!d||!Array.isArray(d.projetos))throw new Error('formato');if(CLOUD){importCloud(d);return;}if(!confirm(`Importar ${d.projetos.length} projetos? Os dados atuais serão substituídos.`))return;S=migrate(d);S.exemplo=false;persist();UI.form=null;go('painel');toast('Dados importados');}
    catch(err){alert('Não foi possível importar: o arquivo não é uma cópia de segurança deste sistema.');}e.target.value='';};rd.readAsText(f);});

$('#logo-file').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  if(f.size>3e6){alert('Arquivo grande demais. Use uma imagem de até 3 MB.');return;}
  const rd=new FileReader();
  rd.onload=()=>{const url=rd.result;
    const done=u=>{S.config.logo=u;persist();render();toast('Logotipo salvo');};
    if(f.type==='image/svg+xml'){done(url);return;}
    const im=new Image();im.onload=()=>{const sc=Math.min(1,600/im.naturalWidth);const c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*sc);c.height=Math.round(im.naturalHeight*sc);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);done(c.toDataURL('image/png'));};
    im.onerror=()=>alert('Não foi possível ler esta imagem.');im.src=url;};
  rd.readAsDataURL(f);});

/* ---------- início ---------- */
const CFG=window.FIREBASE_CONFIG;
if(CFG&&CFG.apiKey&&location.protocol!=='file:'){
  if(window.FB)bootCloud();
  else{CLOUD=true;S=blankCloud('');authScreen('erro','Não foi possível iniciar o Firebase. Confira os dados do arquivo firebase-config.js.');}
}else bootLocal();
})();
</script>
